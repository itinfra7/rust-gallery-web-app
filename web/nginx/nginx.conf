worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    client_max_body_size 512M;

    proxy_connect_timeout 21600;
    proxy_send_timeout    21600;
    proxy_read_timeout    21600;
    send_timeout          21600;

    proxy_buffer_size           128k;
    proxy_buffers               4 256k;
    proxy_busy_buffers_size     256k;

    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=gallery_login_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=gallery_comment_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=gallery_like_limit:10m rate=240r/m;

    upstream rust_backend {
        server <APP_ZEROTIER_IP>:8080;
    }

    server {
        listen       80;
        server_name  <PUBLIC_DOMAIN>;

        location /.well-known/acme-challenge/ {
            root /usr/local/www/certbot;
        }

        return 301 https://<PUBLIC_DOMAIN>$request_uri;
    }

    server {
        listen       443 ssl;
        server_name  <PUBLIC_DOMAIN>;

        ssl_certificate      /usr/local/etc/letsencrypt/live/<PUBLIC_DOMAIN>/fullchain.pem;
        ssl_certificate_key  /usr/local/etc/letsencrypt/live/<PUBLIC_DOMAIN>/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location = /api/login {
            limit_req zone=gallery_login_limit burst=10 nodelay;
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ~ ^/api/image/[0-9a-fA-F-]+/comments$ {
            limit_req zone=gallery_comment_limit burst=30 nodelay;
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ~ ^/api/image/[0-9a-fA-F-]+/like$ {
            limit_req zone=gallery_like_limit burst=80 nodelay;
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /public/ {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /uploads/ {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /api/ {
            proxy_pass http://rust_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
