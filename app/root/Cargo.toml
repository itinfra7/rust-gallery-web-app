[package]
name = "gallery-app"
version = "0.1.0"
edition = "2021"
default-run = "gallery-app"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["multipart", "query"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "limit", "set-header"] }
askama = "0.12"
askama_axum = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum-extra = { version = "0.9", features = ["cookie"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
rand_core = { version = "0.6", features = ["std"] }
once_cell = "1.19"
dotenvy = "0.15"
image = "0.24"
rand = "0.8"
webp-animation = "0.9"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
imageproc = "0.23.0"
rusttype = "0.9"
webp = "0.2"
walkdir = "2.4"
libc = "0.2"
anyhow = "1.0"
httpdate = "1.0"
time = "0.3"
