<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ meta_description }}">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta name="robots" content="max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ meta_description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ og_image_url }}">
    <meta property="og:image:type" content="image/webp">
    <meta property="og:image:alt" content="{{ og_image_alt }}">
    {% if has_og_image_dimensions %}
    <meta property="og:image:width" content="{{ og_image_width }}">
    <meta property="og:image:height" content="{{ og_image_height }}">
    {% endif %}
    <meta property="og:site_name" content="<PUBLIC_DOMAIN>">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ og_image_url }}">
    <meta name="twitter:image:alt" content="{{ og_image_alt }}">
    <script type="application/ld+json">{{ structured_data_json|safe }}</script>
    <script type="application/ld+json">{{ breadcrumb_json|safe }}</script>
    <link rel="alternate" type="application/rss+xml" title="{{ tag_name }} RSS Feed" href="{{ rss_url }}">
    {% include "favicons.html" %}
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1014;
            --panel: #171d24;
            --border: #2a333d;
            --text: #f2f6fb;
            --subtext: #aeb8c4;
            --accent: #79c0ff;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
            background: linear-gradient(180deg, #0b0f14 0%, #121922 100%);
            color: var(--text);
        }
        .page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent);
            text-decoration: none;
        }
        .breadcrumb {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 18px;
            color: var(--subtext);
            font-size: 0.95rem;
        }
        .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
        }
        .breadcrumb-separator {
            opacity: 0.65;
        }
        .hero {
            margin-bottom: 24px;
            padding: 20px 22px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: rgba(23, 29, 36, 0.9);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 2rem;
            line-height: 1.15;
        }
        .summary {
            margin: 0;
            color: var(--subtext);
            line-height: 1.6;
        }
        .count {
            margin-top: 12px;
            color: var(--text);
            font-weight: 600;
        }
        .feed-link {
            display: inline-flex;
            margin-top: 12px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .card {
            display: block;
            color: inherit;
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(23, 29, 36, 0.9);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
        }
        .card img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #000;
        }
        .card-body {
            padding: 12px 14px 14px;
        }
        .date {
            color: var(--subtext);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.88rem;
        }
        .tag {
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
        }
        @media (max-width: 720px) {
            .page {
                padding: 14px 12px 28px;
            }
            .breadcrumb {
                margin-bottom: 12px;
                font-size: 0.88rem;
            }
            .hero {
                margin-bottom: 16px;
                padding: 16px;
                border-radius: 14px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .summary {
                font-size: 0.95rem;
            }
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
            .card {
                border-radius: 12px;
            }
            .card-body {
                padding: 10px 11px 12px;
            }
            .date {
                font-size: 0.84rem;
                margin-bottom: 6px;
            }
            .tag {
                padding: 4px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a class="back-link" href="/">Home</a>
            <span class="breadcrumb-separator">/</span>
            <span>{{ tag_name }}</span>
        </nav>
        <section class="hero">
            <h1>{{ tag_name }}</h1>
            <p class="summary">{{ meta_description }}</p>
            <div class="count">Total {{ total_count }} images</div>
            <a class="feed-link" href="{{ rss_url }}">Tag RSS Feed</a>
        </section>
        <section class="grid">
            {% for img in images %}
                <a class="card" href="{{ img.page_url }}">
                    <img src="{{ img.thumb_url }}" alt="{{ img.alt_text }}" loading="lazy">
                    <div class="card-body">
                        <div class="date">{{ img.date }}</div>
                        <div class="tags">
                            {% for tag in img.tags %}
                                <span class="tag">{{ tag }}</span>
                            {% endfor %}
                        </div>
                    </div>
                </a>
            {% endfor %}
        </section>
    </main>
</body>
</html>
